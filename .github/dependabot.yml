version: 2

# Intentionally omit target-branch, even for the default branch: when it is
# present, GitHub does not apply this entry's options to supported security updates.
updates:
  # requirements-dev.txt includes requirements.txt with a relative -r, so one
  # /web entry keeps production and development requirements in one update set.
  - package-ecosystem: "pip"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    versioning-strategy: "increase"
    commit-message:
      prefix: "deps(python)"
      prefix-development: "deps-dev(python)"
      include: "scope"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      python-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:20"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    rebase-strategy: "auto"
    commit-message:
      prefix: "deps(actions)"
      include: "scope"
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Dependabot scans every Dockerfile* in /docker. Literal FROM tags are
  # updateable; ARG-indirected FROM values and arbitrary git clone refs are not.
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:40"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    rebase-strategy: "auto"
    commit-message:
      prefix: "deps(docker)"
      include: "scope"
    cooldown:
      default-days: 7
    groups:
      docker-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    rebase-strategy: "auto"
    commit-message:
      prefix: "deps(compose)"
      include: "scope"
    cooldown:
      default-days: 7
    groups:
      compose-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
