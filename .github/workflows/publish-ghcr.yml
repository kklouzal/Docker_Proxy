name: Publish Docker images to GHCR

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

# Pull requests, including Dependabot PRs, run the complete release gate with a
# read-only token and no repository secrets. Publishing remains non-PR only.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCKER_BUILD_RECORD_RETENTION_DAYS: 7

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned static-analysis tools
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ZIZMOR_VERSION: "1.29.0"
          SHELLCHECK_VERSION: "0.11.0"
          HADOLINT_VERSION: "2.15.1"
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/static-analysis-bin"
          downloads="${RUNNER_TEMP}/static-analysis-downloads"
          mkdir -p "$bin" "$downloads"

          curl --fail --silent --show-error --location \
            --output "$downloads/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $downloads/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$downloads/actionlint.tar.gz" -C "$downloads" actionlint
          install -m 0755 "$downloads/actionlint" "$bin/actionlint"

          curl --fail --silent --show-error --location \
            --output "$downloads/zizmor.tar.gz" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "dd96df044a6e8538d5f423790f453bdd03d49e5b2bcc38214acc41a2f1297839  $downloads/zizmor.tar.gz" | sha256sum --check
          tar -xzf "$downloads/zizmor.tar.gz" -C "$downloads" zizmor
          install -m 0755 "$downloads/zizmor" "$bin/zizmor"

          curl --fail --silent --show-error --location \
            --output "$downloads/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $downloads/shellcheck.tar.xz" | sha256sum --check
          tar -xJf "$downloads/shellcheck.tar.xz" -C "$downloads"
          install -m 0755 "$downloads/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "$bin/shellcheck"

          curl --fail --silent --show-error --location \
            --output "$downloads/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  $downloads/hadolint" | sha256sum --check
          install -m 0755 "$downloads/hadolint" "$bin/hadolint"

          curl --fail --silent --show-error --location \
            --output "$downloads/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $downloads/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$downloads/gitleaks.tar.gz" -C "$downloads" gitleaks
          install -m 0755 "$downloads/gitleaks" "$bin/gitleaks"

          echo "$bin" >> "$GITHUB_PATH"

      - name: Validate GitHub Actions workflows
        run: actionlint -color=false .github/workflows/*.yml

      - name: Audit GitHub Actions security
        run: zizmor --offline --format github .github/workflows

      - name: Check tracked shell scripts
        shell: bash
        run: git ls-files -z '*.sh' '**/*.sh' | xargs -0 --no-run-if-empty shellcheck

      - name: Lint tracked Dockerfiles
        shell: bash
        run: git ls-files -z 'Dockerfile*' '**/Dockerfile*' | xargs -0 --no-run-if-empty -n1 hadolint

      - name: Validate supported Compose combinations
        shell: bash
        env:
          MYSQL_ROOT_PASSWORD: static…lder
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.ghcr.yml config --quiet
          docker compose -f docker-compose.server002.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.mysql.yml config --quiet
          docker compose -f docker-compose.ghcr.yml -f docker-compose.mysql.yml config --quiet
          docker compose -f docker-compose.server002.yml -f docker-compose.mysql.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.live-tests.yml config --quiet

      - name: Scan current checked-out repository content for secrets
        shell: bash
        run: |
          set -euo pipefail
          scan_root="${RUNNER_TEMP}/gitleaks-current-tree"
          mkdir -p "$scan_root"
          git ls-files -z | xargs -0 --no-run-if-empty cp --parents --target-directory "$scan_root"
          gitleaks dir --no-banner --redact --config .gitleaks.toml "$scan_root"

  ruff-check:
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r web/requirements-dev.txt

      - name: Run Ruff lint
        run: >-
          python -m ruff check
          --output-format=github
          .

  deterministic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ruff-check
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r web/requirements-dev.txt

      - name: Run deterministic tests
        run: >-
          python -m pytest -m "not live and not mysql" -p no:cacheprovider
          --durations=10
          -ra
          web/tests

  mysql-integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ruff-check
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: squid_proxy
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      MYSQL_TEST_HOST: 127.0.0.1
      MYSQL_TEST_PORT: "3306"
      MYSQL_TEST_USER: root
      MYSQL_TEST_PASSWORD: root
      MYSQL_TEST_DATABASE: squid_proxy
      MYSQL_TEST_CONNECT_TIMEOUT: "10"
      MYSQL_CREATE_DATABASE: "1"
      DISABLE_BACKGROUND: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r web/requirements-dev.txt

      - name: Run MySQL lifecycle integration tests
        run: >-
          python -m pytest -m "mysql" -p no:cacheprovider
          --durations=10
          -ra
          web/tests/test_revision_lifecycle_invariants.py
          web/tests/test_proxy_registry.py
          web/tests/test_proxy_write_guard.py
          web/tests/test_mysql_read_query_explain.py
          web/tests/test_mysql_schema_lifecycle.py
          web/tests/test_mysql_fault_injection.py

  build-test-images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [deterministic-tests, mysql-integration-tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: admin-ui
            dockerfile: docker/Dockerfile.admin
          - image: proxy
            dockerfile: docker/Dockerfile.proxy
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Compute OCI build date
        id: build-date
        shell: bash
        run: echo "value=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build local test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: docker-proxy-${{ matrix.image }}:ci
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            GIT_REF_NAME=${{ github.ref_name }}
            BUILD_DATE=${{ steps.build-date.outputs.value }}
            IMAGE_NAME=docker-proxy-${{ matrix.image }}:ci

      - name: Scan exact local image for actionable vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: docker-proxy-${{ matrix.image }}:ci
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          version: v0.73.0

  live-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: build-test-images
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build live-test stack
        run: docker compose -f docker-compose.yml -f docker-compose.live-tests.yml build

      - name: Run live tests
        run: >-
          docker compose -f docker-compose.yml -f docker-compose.live-tests.yml
          up --abort-on-container-exit --exit-code-from live-tests live-tests

      - name: Dump live-test logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.live-tests.yml logs --no-color

      - name: Tear down live-test stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.live-tests.yml down -v --remove-orphans

  publish-images:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: live-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: admin-ui
            dockerfile: docker/Dockerfile.admin
          - image: proxy
            dockerfile: docker/Dockerfile.proxy

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Compute OCI build date
        id: build-date
        shell: bash
        run: echo "value=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            GIT_REF_NAME=${{ github.ref_name }}
            BUILD_DATE=${{ steps.build-date.outputs.value }}
            IMAGE_NAME=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.image }}
          pull: true
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
