name: Publish Docker images to GHCR

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    tags: ["v*"]
  # Weekly forced package refresh: Alpine edge moves without its tag changing.
  # Runs after the Monday Dependabot windows (04:00-05:00 UTC).
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:
    inputs:
      refresh_packages:
        description: "Rebuild Alpine package layers from the current index (no stale build cache)"
        type: boolean
        default: false

# Pull requests, including Dependabot PRs, run the complete release gate with a
# read-only token and no repository secrets. Publishing remains non-PR only.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  DOCKER_BUILD_RECORD_RETENTION_DAYS: 7

# Superseded pull-request runs are cancelled. Runs that publish (push, tag,
# schedule, dispatch) queue instead: a push must not cancel the weekly forced
# package refresh or a half-pushed multi-arch image, and serial runs keep the
# branch tag on the newest commit. GitHub keeps one pending run per group, so
# a newer run still replaces an older one that has not started.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Resolve the floating base tag once so every build in this run, tested and
  # published, uses the same Alpine edge image, and decide whether package
  # layers must bypass the build cache.
  resolve-base:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      alpine-version: ${{ steps.base.outputs.alpine-version }}
      base-digest: ${{ steps.base.outputs.base-digest }}
      package-refresh: ${{ steps.base.outputs.package-refresh }}
    steps:
      - name: Resolve alpine:edge digest and package refresh key
        id: base
        shell: bash
        env:
          FORCE_REFRESH: ${{ github.event_name == 'schedule' || inputs.refresh_packages == true }}
          RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect alpine:edge --format '{{.Manifest.Digest}}')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::could not resolve alpine:edge digest (got '$digest')"
            exit 1
          fi
          refresh=""
          if [ "$FORCE_REFRESH" = "true" ]; then
            refresh="$RUN_KEY"
          fi
          {
            echo "alpine-version=edge@${digest}"
            echo "base-digest=${digest}"
            echo "package-refresh=${refresh}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Base image"
            echo "- alpine:edge@${digest}"
            echo "- forced package refresh: ${FORCE_REFRESH}"
          } >> "$GITHUB_STEP_SUMMARY"

  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned static-analysis tools
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ZIZMOR_VERSION: "1.32.0"
          SHELLCHECK_VERSION: "0.11.0"
          HADOLINT_VERSION: "2.15.1"
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/static-analysis-bin"
          downloads="${RUNNER_TEMP}/static-analysis-downloads"
          mkdir -p "$bin" "$downloads"

          curl --fail --silent --show-error --location \
            --output "$downloads/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $downloads/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$downloads/actionlint.tar.gz" -C "$downloads" actionlint
          install -m 0755 "$downloads/actionlint" "$bin/actionlint"

          curl --fail --silent --show-error --location \
            --output "$downloads/zizmor.tar.gz" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "bb110cc765eca9cd7efb2e284a956be5974c60027b0970f16397d86208a9957b  $downloads/zizmor.tar.gz" | sha256sum --check
          tar -xzf "$downloads/zizmor.tar.gz" -C "$downloads" zizmor
          install -m 0755 "$downloads/zizmor" "$bin/zizmor"

          curl --fail --silent --show-error --location \
            --output "$downloads/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $downloads/shellcheck.tar.xz" | sha256sum --check
          tar -xJf "$downloads/shellcheck.tar.xz" -C "$downloads"
          install -m 0755 "$downloads/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "$bin/shellcheck"

          curl --fail --silent --show-error --location \
            --output "$downloads/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  $downloads/hadolint" | sha256sum --check
          install -m 0755 "$downloads/hadolint" "$bin/hadolint"

          curl --fail --silent --show-error --location \
            --output "$downloads/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $downloads/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$downloads/gitleaks.tar.gz" -C "$downloads" gitleaks
          install -m 0755 "$downloads/gitleaks" "$bin/gitleaks"

          echo "$bin" >> "$GITHUB_PATH"

      - name: Validate GitHub Actions workflows
        run: actionlint -color=false .github/workflows/*.yml

      - name: Audit GitHub Actions security
        run: zizmor --offline --format github .github/workflows

      - name: Check tracked shell scripts
        shell: bash
        run: git ls-files -z '*.sh' '**/*.sh' | xargs -0 --no-run-if-empty shellcheck

      - name: Lint tracked Dockerfiles
        shell: bash
        run: git ls-files -z 'Dockerfile*' '**/Dockerfile*' | xargs -0 --no-run-if-empty -n1 hadolint

      - name: Validate supported Compose combinations
        shell: bash
        env:
          MYSQL_ROOT_PASSWORD: static…lder
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.ghcr.yml config --quiet
          docker compose -f docker-compose.server002.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.mysql.yml config --quiet
          docker compose -f docker-compose.ghcr.yml -f docker-compose.mysql.yml config --quiet
          docker compose -f docker-compose.server002.yml -f docker-compose.mysql.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.live-tests.yml config --quiet

      - name: Scan current checked-out repository content for secrets
        shell: bash
        run: |
          set -euo pipefail
          scan_root="${RUNNER_TEMP}/gitleaks-current-tree"
          mkdir -p "$scan_root"
          git ls-files -z | xargs -0 --no-run-if-empty cp --parents --target-directory "$scan_root"
          gitleaks dir --no-banner --redact --config .gitleaks.toml "$scan_root"

  ruff-check:
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r web/requirements-dev.txt

      - name: Run Ruff lint
        run: >-
          python -m ruff check
          --output-format=github
          .

  deterministic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ruff-check
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r web/requirements-dev.txt

      - name: Run deterministic tests
        run: >-
          python -m pytest -m "not live and not mysql" -p no:cacheprovider
          --durations=10
          -ra
          web/tests

  mysql-integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: ruff-check
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: squid_proxy
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      MYSQL_TEST_HOST: 127.0.0.1
      MYSQL_TEST_PORT: "3306"
      MYSQL_TEST_USER: root
      MYSQL_TEST_PASSWORD: root
      MYSQL_TEST_DATABASE: squid_proxy
      MYSQL_TEST_CONNECT_TIMEOUT: "10"
      MYSQL_CREATE_DATABASE: "1"
      DISABLE_BACKGROUND: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r web/requirements-dev.txt

      # Most MySQL-backed tests are not marked "mysql" (they skip without a
      # configured database), so run the whole non-live suite here.
      - name: Run MySQL-backed tests
        run: >-
          python -m pytest -m "not live" -p no:cacheprovider
          --durations=10
          -ra
          web/tests

  build-test-images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [resolve-base, deterministic-tests, mysql-integration-tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: admin-ui
            dockerfile: docker/Dockerfile.admin
          - image: proxy
            dockerfile: docker/Dockerfile.proxy
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Compute OCI build date
        id: build-date
        shell: bash
        run: echo "value=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build local test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          pull: true
          tags: docker-proxy-${{ matrix.image }}:ci
          labels: |
            org.opencontainers.image.base.digest=${{ needs.resolve-base.outputs.base-digest }}
          build-args: |
            ALPINE_VERSION=${{ needs.resolve-base.outputs.alpine-version }}
            PACKAGE_REFRESH=${{ needs.resolve-base.outputs.package-refresh }}
            APP_VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            GIT_REF_NAME=${{ github.ref_name }}
            BUILD_DATE=${{ steps.build-date.outputs.value }}
            IMAGE_NAME=docker-proxy-${{ matrix.image }}:ci

      - name: Report resolved package snapshot
        shell: bash
        env:
          IMAGE_REF: docker-proxy-${{ matrix.image }}:ci
        run: |
          set -euo pipefail
          {
            echo "### ${IMAGE_REF} build-info"
            echo '```'
            docker run --rm --entrypoint cat "$IMAGE_REF" /usr/share/docker-proxy/build-info
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Scan exact local image for actionable vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: docker-proxy-${{ matrix.image }}:ci
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          version: v0.76.2

  live-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [resolve-base, build-test-images]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build live-test stack
        env:
          ALPINE_VERSION: ${{ needs.resolve-base.outputs.alpine-version }}
          PACKAGE_REFRESH: ${{ needs.resolve-base.outputs.package-refresh }}
        run: >-
          docker compose -f docker-compose.yml -f docker-compose.live-tests.yml
          build --pull
          --build-arg "ALPINE_VERSION=${ALPINE_VERSION}"
          --build-arg "PACKAGE_REFRESH=${PACKAGE_REFRESH}"

      - name: Run live tests
        run: >-
          timeout --foreground --signal=TERM --kill-after=30s 25m
          docker compose -f docker-compose.yml -f docker-compose.live-tests.yml
          up --abort-on-container-exit --exit-code-from live-tests live-tests

      - name: Capture bounded live-test diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p live-test-diagnostics
          compose=(docker compose -f docker-compose.yml -f docker-compose.live-tests.yml)
          services=(proxy proxy-edge-2 admin-ui live-tests)

          timeout --foreground --kill-after=5s 30s \
            "${compose[@]}" ps --all "${services[@]}" \
            >live-test-diagnostics/compose-ps.txt 2>&1
          timeout --foreground --kill-after=5s 30s \
            "${compose[@]}" ps --all --format json "${services[@]}" \
            >live-test-diagnostics/compose-ps.json 2>&1

          for service in "${services[@]}"; do
            timeout --foreground --kill-after=5s 30s \
              "${compose[@]}" logs --no-color --timestamps --tail 200 "$service" \
              >"live-test-diagnostics/${service}.log" 2>&1
          done

      - name: Retain live-test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: live-test-diagnostics/
          if-no-files-found: error
          retention-days: 14

      - name: Tear down live-test stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.live-tests.yml down -v --remove-orphans

  publish-images:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [resolve-base, live-tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: admin-ui
            dockerfile: docker/Dockerfile.admin
          - image: proxy
            dockerfile: docker/Dockerfile.proxy

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Compute OCI build date
        id: build-date
        shell: bash
        run: echo "value=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.base.digest=${{ needs.resolve-base.outputs.base-digest }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # A forced refresh (schedule or dispatch input) sets PACKAGE_REFRESH,
          # which invalidates the cached Alpine package layers of every stage.
          build-args: |
            ALPINE_VERSION=${{ needs.resolve-base.outputs.alpine-version }}
            PACKAGE_REFRESH=${{ needs.resolve-base.outputs.package-refresh }}
            APP_VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
            GIT_REF_NAME=${{ github.ref_name }}
            BUILD_DATE=${{ steps.build-date.outputs.value }}
            IMAGE_NAME=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.image }}
          pull: true
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
