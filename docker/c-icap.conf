# Minimal c-icap config for AV scanning.
# NOTE: Exact module/service names depend on the built c-icap-modules set.
# We'll start with a conservative config and adjust after verifying the installed .so names.

ServerName squid-flask-proxy-cicap
PidFile /var/run/c-icap/c-icap.pid

# Use a port dedicated to AV c-icap (separate from Squid's proxy ports).
# The entrypoint rewrites this from CICAP_AV_PORT when configured.
Port 127.0.0.1:14001

# Paths (defaults for source installs; included for clarity)
ModulesDir /usr/lib/c_icap
ServicesDir /usr/lib/c_icap
TemplateDir /usr/share/c_icap/templates

# Logging to stdout/stderr via supervisord
DebugLevel 0

# Process/thread pool. The compiled-in defaults start five children of 30+
# threads each per AV instance; this service only handles upload (REQMOD)
# scans and local-clamd RESPMOD, so start one child and grow on demand.
# Measured per instance: 6 processes / 14.2 MiB anon -> 2 / 4.6 MiB, and a
# burst of 40 concurrent 200 KB scans still completed on the single child.
StartServers 1
MaxServers 4
ThreadsPerChild 16
MinSpareThreads 4
MaxSpareThreads 24

# Load AV engine modules before starting AV services.
Include /etc/clamd_mod.conf

# Service mapping:
# We intentionally name it "avrespmod" to match the Squid ICAP URL path.
# Keep allow204 out of the alias so virus_scan.Allow204Responces remains the
# authoritative operator setting from /etc/virus_scan.conf.
Service virus_scan virus_scan.so
ServiceAlias avrespmod virus_scan?sizelimit=off&mode=simple

# Module/service configuration (provided by this repo)
# These files are copied into /etc (not /etc/c-icap), so use absolute paths.
Include /etc/virus_scan.conf
