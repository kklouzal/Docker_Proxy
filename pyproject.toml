[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = [
    ".venv",
    ".ruff_cache",
]

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    # Ownership/legal boilerplate is not a useful proxy quality gate.
    "missing-copyright-notice",

    # Enforce behavior and maintainability, not boilerplate documentation churn.
    "undocumented-public-module",
    "undocumented-public-class",
    "undocumented-public-method",
    "undocumented-public-function",
    "undocumented-public-package",
    "undocumented-magic-method",
    "undocumented-public-init",
    "non-imperative-mood",
    "docstring-missing-returns",
    "docstring-missing-exception",

    # Duplicate pydocstyle opinions; keep the compatible counterparts enabled.
    "incorrect-blank-line-before-class",
    "multi-line-summary-second-line",

    # Annotation-presence rules cause broad retrofits without proving runtime
    # correctness. Keep real type errors for type checkers, not Ruff ceremony.
    "missing-type-function-argument",
    "missing-type-args",
    "missing-type-kwargs",
    "missing-return-type-public-function",
    "missing-return-type-private-function",
    "missing-return-type-special-method",
    "any-type",

    # Existing route/service complexity should be refactored deliberately, not
    # because a lint gate picked an arbitrary threshold.
    "complex-structure",
    "too-many-public-methods",
    "too-many-return-statements",
    "too-many-branches",
    "too-many-arguments",
    "too-many-locals",
    "too-many-statements",
    "too-many-boolean-expressions",
    "too-many-positional-arguments",
    "too-many-nested-blocks",
    "too-many-statements-in-try-clause",

    # This proxy intentionally degrades around many external systems. Keep rules
    # for exception chaining and bad raise structure enabled.
    "blind-except",
    "try-except-pass",
    "try-except-continue",

    # Ruff format owns wrapping; residual long lines are usually literals,
    # command snippets, generated messages, URLs, or SQL fragments.
    "line-too-long",

    # Boolean argument/call and magic-value style checks are too noisy for
    # compact policy/config data and HTTP/status-code heavy code.
    "boolean-type-hint-positional-argument",
    "boolean-default-value-positional-argument",
    "boolean-positional-value-in-call",
    "magic-value-comparison",

    # Existing Flask and service modules use intentional lazy imports/globals for
    # environment-sensitive initialization and monkeypatchable operational state.
    "import-outside-top-level",
    "global-statement",

    # Internal modules intentionally share private helpers/state.
    "import-private-name",
    "private-member-access",

    # Blanket type ignores are mostly compatibility/import shims here.
    "blanket-type-ignore",

    # Subprocess usage is against fixed appliance tools with shell=False; the
    # code commonly inspects return codes instead of raising immediately.
    "subprocess-run-without-check",
    "suspicious-subprocess-import",
    "subprocess-without-shell-equals-true",
    "start-process-with-partial-path",

    # Explicit empty-string comparisons often document None-vs-empty intent.
    "compare-to-empty-string",

    # Avoid churning cohesive service APIs into staticmethod-heavy classes.
    "no-self-use",

    # Pathlib/file-read modernization is not a material proxy quality gate.
    "read-whole-file",
    "os-stat",
    "os-path-join",
    "os-path-splitext",
    "os-listdir",

    # Legacy package layout and __init__ behavior are intentional.
    "implicit-namespace-package",
    "non-empty-init-module",

    # Style-only simplifications are not worth broad churn here.
    "builtin-argument-shadowing",
    "unused-function-argument",
    "unused-method-argument",
    "function-uses-loop-variable",
    "class-as-data-structure",
    "commented-out-code",
    "pytest-raises-too-broad",
    "pytest-raises-with-multiple-statements",
    "pytest-assert-in-except",
    "pytest-fixture-param-without-value",
    "pytest-parameter-with-default-argument",
    "collapsible-if",
    "suppressible-exception",
    "open-file-with-context-handler",
    "multiple-with-statements",
    "type-check-without-type-error",
    "try-consider-else",
    "raise-within-try",

    # Keep formatter-only style out of the blocking lint gate.
    "missing-trailing-comma",
    "single-line-implicit-string-concatenation",
    "bad-quotes-inline-string",
    "bad-quotes-multiline-string",
    "bad-quotes-docstring",
    "avoidable-escaped-quote",
    "unnecessary-escaped-quote",
]

[tool.ruff.lint.per-file-ignores]
# Pytest asserts and fixture secrets are idiomatic test scaffolding.
"web/tests/**/*.py" = [
    "unused-function-argument",
    "unused-method-argument",
    "unused-lambda-argument",
    "import-outside-top-level",
    "assert",
    "hardcoded-password-string",
    "hardcoded-password-func-arg",
    "hardcoded-password-default",
    "hardcoded-temp-file",
    "suspicious-url-open-usage",
]


# Post-insert invariants use asserts for narrowing after immediate fetches.
"web/services/adblock_artifacts.py" = ["assert", "hardcoded-sql-expression"]
"web/services/certificate_bundles.py" = ["assert"]
"web/services/config_revisions.py" = ["assert", "hardcoded-sql-expression"]
"web/services/observability_maintenance.py" = ["assert", "hardcoded-sql-expression"]
"web/services/proxy_registry.py" = ["assert", "hardcoded-sql-expression"]
"web/services/schema_lifecycle.py" = ["hardcoded-sql-expression"]

# SHA-1 is used only for non-security fingerprints/cache keys in these files.
"web/services/adblock_store.py" = ["suspicious-url-open-usage", "hashlib-insecure-hash-function", "hardcoded-sql-expression"]
"web/services/blocked_log_runtime.py" = ["hardcoded-sql-expression"]
"web/services/diagnostic_store.py" = ["hashlib-insecure-hash-function", "hardcoded-sql-expression"]
"web/services/ssl_errors_store.py" = ["hashlib-insecure-hash-function", "hardcoded-sql-expression"]
"web/tests/mysql_test_utils.py" = ["hashlib-insecure-hash-function"]
"web/tools/adblock_compile.py" = ["hashlib-insecure-hash-function"]

# These modules compose SQL from fixed templates, validated table-name helpers,
# and bound parameters; Ruff cannot see those guards.
"web/services/observability_queries.py" = ["hardcoded-sql-expression"]
"web/services/operation_ledger.py" = ["hardcoded-sql-expression"]
"web/services/pac_profiles_store.py" = ["hardcoded-sql-expression"]
"web/services/policy_requests.py" = ["hardcoded-sql-expression"]
"web/services/safe_browsing_v5.py" = ["suspicious-url-open-usage", "hardcoded-sql-expression"]
"web/services/sslfilter_store.py" = ["hardcoded-sql-expression"]
"web/services/timeseries_store.py" = ["hardcoded-sql-expression"]
"web/services/webfilter_core.py" = ["hardcoded-sql-expression"]
"web/services/webfilter_store.py" = ["hardcoded-sql-expression"]
"web/tools/webcat_acl.py" = ["hardcoded-sql-expression"]

# Docker/web services intentionally bind to all interfaces inside containers.
"web/app.py" = ["hardcoded-bind-all-interfaces", "unsafe-markup-use"]
"web/services/health_checks.py" = ["hardcoded-bind-all-interfaces"]
"web/tests/live_fixture_server.py" = ["hardcoded-bind-all-interfaces"]

# "secret" appears in path names here, not embedded credential material.
"web/services/auth_store.py" = ["hardcoded-password-string"]

# Fixed cache/runtime locations and controlled URL openers are intentional here.
"proxy/runtime.py" = ["hardcoded-temp-file"]
"web/services/proxy_client.py" = ["suspicious-url-open-usage"]
"web/tools/webcat_build.py" = ["suspicious-url-open-usage"]
